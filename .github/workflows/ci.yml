name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pyright
      # Offline suite: no secrets, no network. LLM turn tests (tests/test_agent_turns.py)
      # are skipped unless RUN_LLM_TESTS=1 and LIVEKIT_API_KEY / LIVEKIT_API_SECRET are set.
      - run: uv run pytest -q
